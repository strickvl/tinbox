name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual triggers

jobs:
  test:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and select Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.4"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdfinfo -v
          pdftoppm -v

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Install locked dependencies
        run: uv sync --locked --all-extras

      - name: Run tests
        run: just test --cov=tinbox --cov-report=xml -v
        env:
          # Provider tests use mocked clients and do not need API credentials.
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GOOGLE_API_KEY: ""

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          use_oidc: true
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Install locked dependencies
        run: uv sync --locked --all-extras

      - name: Run ruff
        run: just lint

      - name: Check formatting
        run: just format-check

      - name: Check types
        run: just types

      - name: Check file length
        run: just file-length
