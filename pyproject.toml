[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinbox"
version = "0.4.0"
description = "A CLI translation tool using LLMs for document translation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["translation", "llm", "cli", "pdf", "docx"]
authors = [{ name = "strickvl", email = "your.email@example.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.7.0",
    "pydantic>=2.8.0,<3.0.0",
    "structlog>=24.1.0",
    "pypdf>=5.3.0",
    "python-docx>=1.1.2",
    "tenacity>=8.2.3",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.92.0"]
anthropic = ["anthropic>=0.88.0"]
pdf = ["pdf2image>=1.17.0"]
docx = ["python-docx>=1.1.0"]
all = [
    "openai>=1.92.0",
    "anthropic>=0.88.0",
    "pdf2image>=1.17.0",
    "python-docx>=1.1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]

[project.scripts]
tinbox = "tinbox.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tinbox"]

[tool.pytest.ini_options]
minversion = "9.0.3"
addopts = "-ra -q --cov=tinbox"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "RUF"]
ignore = [
    "B008",    # Function calls in argument defaults (required for typer)
    "B904",    # Raise from within except (pre-existing, fix separately)
    "B017",    # Assert blind exception in tests (acceptable for tests)
    "E501",    # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/tinbox/core/doctor.py" = ["F401"]  # Intentional imports to check availability

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
